# ============================================================================
# Config train THẬT trên Kaggle Notebook (GPU P100 hoặc T4x2).
# Chạy bằng: python -m src.train --config configs/kaggle_config.yaml
# ============================================================================

experiment_name: "wheat_kaggle_run"

# ─── Đường dẫn dữ liệu ──────────────────────────────────────────────────────
# Đường dẫn mount mặc định khi add cuộc thi "Global Wheat Detection" qua tab
# Competitions trên Kaggle. Nếu bạn add qua Datasets thường (không phải qua
# Competitions), đường dẫn thường là "/kaggle/input/global-wheat-detection/..."
# (không có "competitions/") -> chỉnh lại 2 dòng dưới cho khớp.
data_dir: "/kaggle/input/competitions/global-wheat-detection/train"
csv_path: "/kaggle/input/competitions/global-wheat-detection/train.csv"
# /kaggle/working là nơi DUY NHẤT Kaggle cho phép ghi file, và là nơi có thể tải
# file về sau khi Notebook chạy xong (Output của Notebook).
output_dir: "/kaggle/working/outputs"

# ─── Reproducibility ────────────────────────────────────────────────────────
seed: 42

# ─── Chia Train/Validation ──────────────────────────────────────────────────
# Dùng Stratified K-Fold theo cột "source" (nguồn ảnh), chia theo từng image_id
# duy nhất (xem src/train.py::create_fold_split). n_splits=5 nghĩa là chia 5 phần
# bằng nhau, "fold" là phần được chọn làm validation ở lần chạy này.
n_splits: 5
fold: 0

# ─── Model ───────────────────────────────────────────────────────────────────
num_classes: 2   # 0: background, 1: wheat_head
pretrained: true # tải pretrained weights COCO -> cần bật "Internet" trong Notebook Settings

# ─── Ảnh & Augmentation ──────────────────────────────────────────────────────
image_size: 1024

# ─── DataLoader ──────────────────────────────────────────────────────────────
batch_size: 8
num_workers: 4
pin_memory: true

# ─── Optimizer (SGD) ─────────────────────────────────────────────────────────
learning_rate: 0.005
momentum: 0.9
weight_decay: 0.0005

# ─── Training ────────────────────────────────────────────────────────────────
num_epochs: 15
# Automatic Mixed Precision: train nhanh hơn & tốn ít VRAM hơn trên GPU hỗ trợ
# Tensor Core (hiệu quả rõ rệt trên T4, hạn chế hơn trên P100 đời cũ).
use_amp: true
